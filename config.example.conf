# Memo Words configuration.
# Copy to ~/.config/memo-words/config.conf (or point MEMO_CONFIG at this file).
# Every key is optional; omitted keys keep their default. Unknown keys and
# unparseable values are ignored.

# Seconds each word stays on screen before the next one (default 30).
interval_secs = 30

# Random +/- variation applied to the interval, in seconds (default 0 = off).
# e.g. interval_secs=30, jitter_secs=10 -> each word stays 20-40s.
jitter_secs = 0

# Seconds after the word appears before the transcription fades in (default 5).
transcription_delay = 5

# Seconds after the word appears before the translation fades in (default 10).
translation_delay = 10

# Fade-in duration in seconds (default 1).
fade_duration = 1

# Which screen corner the card sits in (default bottom-right).
# One of: top-left, top-right, bottom-left, bottom-right
corner = bottom-right

# Speak each word aloud when it appears, using the system voice (default off).
# macOS only (uses `say`); ignored on other platforms.
# One of: true/false (also 1/0, yes/no, on/off)
speak = false

# Card background opacity, 0.0 (invisible) to 1.0 (opaque). Default ~0.30.
card_opacity = 0.3

# Card corner radius in points (default 16, max 64).
corner_radius = 16

# Card distance from the selected screen edges, in points (default 40, max 240).
screen_margin = 40

# Active-recall mode (default off). When on, the translation (and the example
# after it) is held back until ~55% of the interval has passed, so you get a
# real window to recall the meaning before it's revealed. Never reveals earlier
# than translation_delay, so a long delay still wins on short intervals.
# One of: true/false (also 1/0, yes/no, on/off)
recall_mode = false

# Faint progress underline for the current word interval (default off). It
# updates roughly once per second after the reveal animation settles, so it
# stays calm and low-cost while giving a timer-app/status-bar sense of cadence.
# One of: true/false (also 1/0, yes/no, on/off)
pace_indicator = false

# Subtle accent for the example headword and the pace indicator fill. Use a
# calm RGB hex colour, or one of: plain, mint, sky, rose. Default is plain
# (#E6E6E6).
accent_color = plain

# Tiny count of words shown during the current app session (default off).
# One of: true/false (also 1/0, yes/no, on/off)
session_counter = false

# Stronger card material, border, and secondary text for bright or busy
# wallpapers (default off). Keeps the same layout and calm motion.
# One of: true/false (also 1/0, yes/no, on/off)
high_contrast = false

# Slightly dim words that have already appeared in this app session (default
# off). Useful when repeated exposure should feel quieter than novelty.
# One of: true/false (also 1/0, yes/no, on/off)
familiarity_dimming = false

# Local quiet windows when rotation pauses automatically (default off). Use
# comma-separated 24h ranges; overnight ranges are allowed.
# Examples: off, 09:00-17:00, 22:00-01:00
focus_hours = off

# Append shown words to a dated Markdown rollup (default off). The path is
# MEMO_ROLLUP, or ~/.config/memo-words/daily-rollup.md when unset.
# One of: true/false (also 1/0, yes/no, on/off)
daily_rollup = false

# Gently boost copied/recently revisited words in future rotation (default off).
# One of: true/false (also 1/0, yes/no, on/off)
quiet_review_weighting = false

# Temporary safe-area guides for tuning corner and screen_margin (default off).
# One of: true/false (also 1/0, yes/no, on/off)
placement_preview = false

# Open the compact preferences window on launch (default off). While open, the
# overlay is temporarily clickable; closing it returns to click-through mode.
# One of: true/false (also 1/0, yes/no, on/off)
preferences_open = false

# Freeze the current word on launch while keeping tray copy/export available
# (default off).
# One of: true/false (also 1/0, yes/no, on/off)
session_frozen = false

# Override the recent-word cooldown window. 0 keeps the automatic deck-sized
# window; positive values are capped so at least one candidate remains.
cooldown_words = 0
